name: Validate JavaScript plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Ghostdehole/WEBUI.for.SingBox
          ref: main
          path: .validator
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .validator/go.mod
          cache-dependency-path: .validator/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Behavioral, compatibility and conflict tests
        run: node --test tests/*.test.mjs
      - name: Validate JavaScript and SHA256 index with WebUI's parser
        working-directory: .validator
        run: go run ./cmd/plugin-check ..
      - name: Verify plugin catalog and subscription identity integration
        working-directory: .validator
        env:
          WEBUI_PLUGIN_REPO: ${{ github.workspace }}
        run: go run ./tests ./bridge/runtime ./bridge/plugincatalog -short -count=1 -timeout=90s
      - name: Download pinned Linux cores and verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          # Digests from the immutable official release assets:
          # https://github.com/SagerNet/sing-box/releases/expanded_assets/v1.14.0
          # https://github.com/SagerNet/sing-box/releases/expanded_assets/v1.14.2
          # https://github.com/SagerNet/sing-box/releases/expanded_assets/v1.14.4
          for version in 1.14.0 1.14.2 1.14.4; do
            case "$version" in
              1.14.0) digest=2375de6999f4f56ab46b4fc5ddf26a6aba1d3e61a0f4e7ddec2f4690457d5f63 ;;
              1.14.2) digest=a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6 ;;
              1.14.4) digest=699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968 ;;
              *) exit 1 ;;
            esac
            tool_dir="$RUNNER_TEMP/plugin-core-check/$version"
            mkdir -p "$tool_dir"
            archive="$tool_dir/core.tar.gz"
            curl --fail --show-error --silent --location \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 15 --max-time 120 --retry 2 --retry-max-time 180 \
              --output "$archive" \
              "https://github.com/SagerNet/sing-box/releases/download/v$version/sing-box-$version-linux-amd64.tar.gz"
            printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict
            tar -xzf "$archive" -C "$tool_dir" --strip-components=1 \
              "sing-box-$version-linux-amd64/sing-box"
            "$tool_dir/sing-box" version
          done
      - name: Execute actual Goja and real sing-box 1.14.0, 1.14.2 and 1.14.4 checks
        working-directory: .validator
        shell: bash
        run: |
          set -euo pipefail
          for version in 1.14.0 1.14.2 1.14.4; do
            SING_BOX_114_PATH="$RUNNER_TEMP/plugin-core-check/$version/sing-box" \
              go run ../tests/goja/main.go ..
          done
